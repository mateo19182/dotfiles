# Language runtimes and npm/pip CLIs. Coding agents come from Nix (llm-agents), except OpenCode:
# its 2.x line (npm @opencode/cli) is newer than llm-agents' 1.x and owns ~/.local/share/opencode/opencode.db.
[tools]
node = "lts"
go = "latest"
rust = "stable"
python = "3.13"
uv = "latest"
pnpm = "latest"
git-lfs = "latest"
"npm:@microck/canonfig" = { version = "7.9.0", allow_low_downloads = true }
"npm:@opencode/cli" = { version = "latest", postinstall = "cd $MISE_TOOL_INSTALL_PATH/node_modules/@opencode/cli && node postinstall.mjs" }

[settings]
# Prebuilt binaries over source builds; nix-ld makes them run on NixOS.
python.compile = false
# mise defaults to compiling everything on NixOS (node from source takes ~45 min).
all_compile = false
